
type CategoryType {
  id: ID!
  name: String!
  description: String
}

type ProductType {
  id: ID!
  name: String!
  price: Float!
  sku: String!
  categoryId: String!
  category: CategoryType
}

type ReceiptType {
  receiptId: ID!
  name: String!
  price: Float!
  issuedAt: String!
}

type Query {
  categories: [CategoryType!]!
  products: [ProductType!]!
  product(id: String!): ProductType
  receipts: [ReceiptType!]!
  receipt(receiptId: String!): ReceiptType!
}

type Mutation {
  createCategory(name: String!, description: String): CategoryType!
  createProduct(input: CreateProductInput!): ProductType!
  createReceipt(name: String!, price: Float!, issuedAt: String!): ReceiptType!
  deleteReceipt(receiptId: String!): Boolean!
}

input CreateProductInput {
  name: String!
  price: Float!
  sku: String!
  categoryId: String!
}